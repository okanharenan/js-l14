<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Álbuns</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-4">Álbuns</h1>

        <!-- Lista de álbuns -->
        <div id="albums" class="row g-4"></div>

        <hr class="my-5">

        <!-- Fotos do álbum selecionado -->
        <h2 id="photos-title" class="mb-4"></h2>

        <div id="photos" class="row g-4"></div>

    </div>

    <script>

        const albumsContainer = document.getElementById("albums");
        const photosContainer = document.getElementById("photos");
        const photosTitle = document.getElementById("photos-title");

        // Busca todos os álbuns
        async function carregarAlbuns() {

            try {

                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/albums"
                );

                const albums = await response.json();

                albums.forEach(album => {

                    const card = document.createElement("div");

                    card.className = "col-12 col-sm-6 col-md-4 col-lg-3";

                    card.innerHTML = `
                        <div
                            class="card h-100 shadow-sm"
                            style="cursor: pointer;"
                            onclick="carregarFotos(${album.id}, '${album.title}')"
                        >

                            <div class="card-body">

                                <h5 class="card-title">
                                    Álbum ${album.id}
                                </h5>

                                <p class="card-text">
                                    ${album.title}
                                </p>

                            </div>

                            <div class="card-footer text-center">
                                <small class="text-muted">
                                    Clique para visualizar as fotos
                                </small>
                            </div>

                        </div>
                    `;

                    albumsContainer.appendChild(card);

                });

            } catch (error) {

                albumsContainer.innerHTML = `
                    <div class="alert alert-danger">
                        Erro ao carregar os álbuns.
                    </div>
                `;

                console.error(error);
            }
        }


        // Busca as fotos do álbum selecionado
        async function carregarFotos(albumId, albumTitle) {

            photosContainer.innerHTML = `
                <div class="text-center">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-2">Carregando fotos...</p>
                </div>
            `;

            photosTitle.textContent = `Fotos do álbum ${albumId}: ${albumTitle}`;

            try {

                const response = await fetch(
                    `https://jsonplaceholder.typicode.com/albums/${albumId}/photos`
                );

                const photos = await response.json();

                photosContainer.innerHTML = "";

                photos.forEach(photo => {

                    const card = document.createElement("div");

                    card.className = "col-12 col-sm-6 col-md-4 col-lg-3";

                    card.innerHTML = `
                        <div class="card h-100 shadow-sm">

                            <img
                                src="https://picsum.photos/200/150?random=${photo.id}}"
                                class="card-img-top"
                                alt="${photo.title}"
                            >

                            <div class="card-body">

                                <h6 class="card-title">
                                    ${photo.title}
                                </h6>

                                <p class="card-text">
                                    ID da foto: ${photo.id}
                                </p>

                            </div>

                        </div>
                    `;

                    photosContainer.appendChild(card);

                });

            } catch (error) {

                photosContainer.innerHTML = `
                    <div class="alert alert-danger">
                        Erro ao carregar as fotos.
                    </div>
                `;

                console.error(error);
            }
        }


        // Inicializa a aplicação
        carregarAlbuns();

    </script>

</body>
</html>
